</head>
<body>

  <div class="page-content">

  <!-- NAVBAR -->
  <nav class="navbar">
    <div class="nav-inner">
      <a href="index.html" class="nav-logo" aria-label="Plume de fond — accueil">
                <img class="logo-svg" src="logo-plume-de-fond.svg" alt="Plume de fond">
      </a>
      <ul class="nav-links">
        <li><a href="vision.html">NOTRE VISION<svg class="pencil-circle" viewBox="0 0 200 70" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M 120 5 C 160 3, 193 14, 191 32 C 189 50, 155 64, 100 65 C 45 66, 7 52, 6 34 C 5 16, 45 4, 110 3 C 155 2, 190 14, 188 32" stroke="#1b1916" stroke-width="1.8" stroke-linecap="round" fill="none"/></svg></a></li>

      </ul>
    </div>
  </nav>

  <!-- CONTACT -->
  <section class="mailing" id="contact">
    <div class="mailing-inner">
      <h2 class="mailing-title">Parlez-nous de vos enjeux.</h2>
      <form class="contact-form" action="https://formspree.io/f/xlgqozzr" method="POST">
        <div class="form-row">
          <input type="text" name="prenom" placeholder="Prénom" required>
          <input type="text" name="nom" placeholder="Nom" required>
        </div>
        <input type="email" name="email" placeholder="Email" required>
        <textarea name="message" placeholder="Votre message" rows="4" required></textarea>
        <input type="text" name="_gotcha" style="display:none" tabindex="-1" autocomplete="off" aria-hidden="true">
        <input type="hidden" name="_subject" value="Nouveau message via plumedefond.fr">
        <button type="submit">Envoyer</button>
        <p class="form-status" role="status" aria-live="polite"></p>
      </form>
    </div>
  </section>

  </div><!-- fin .page-content -->

  <!-- FOOTER -->
  <footer class="footer">
    <div class="footer-inner">
      <div class="footer-col">
        <p class="footer-heading">L'ENTREPRISE</p>
        <ul>
          <li><a href="vision.html">Notre vision</a></li>
          <li><a href="contact.html">Contact</a></li>
        </ul>
      </div>
      <div class="footer-col">
        <p class="footer-heading">LÉGAL</p>
        <ul>
          <li><a href="confidentialite.html">Politique de confidentialité</a></li>
          <li><a href="mentions-legales.html">Mentions légales</a></li>
        </ul>
      </div>
      <div class="footer-col footer-col-logo">
        <img class="footer-logo" src="logo-plume-de-fond-blanc.svg" alt="Plume de fond">
      </div>
    </div>
    <div class="footer-bottom">
      <p>&copy; 2026 Plume de fond. Tous droits reserves.</p>
    </div>
  </footer>


  <script>
    (function() {
      document.querySelectorAll('.contact-form').forEach(function(form) {
        var status = form.querySelector('.form-status');
        form.addEventListener('submit', function(e) {
          e.preventDefault();
          var btn = form.querySelector('button[type="submit"]');
          btn.disabled = true;
          var label = btn.textContent;
          btn.textContent = 'Envoi\u2026';
          status.textContent = '';
          status.classList.remove('ok', 'err');
          fetch(form.action, {
            method: 'POST',
            body: new FormData(form),
            headers: { 'Accept': 'application/json' }
          }).then(function(r) {
            if (!r.ok) throw new Error();
            form.reset();
            status.textContent = 'Message bien envoy\u00e9 \u2014 nous vous r\u00e9pondrons rapidement.';
            status.classList.add('ok');
          }).catch(function() {
            status.textContent = "L'envoi a \u00e9chou\u00e9 \u2014 \u00e9crivez-nous directement \u00e0 contact@plumedefond.fr";
            status.classList.add('err');
          }).finally(function() {
            btn.disabled = false;
            btn.textContent = label;
          });
        });
      });
    })();
  </script>
